apis:
  - aid: mockoon:mockoon
    name: Mockoon
    description: >-
      Mockoon ships as a desktop application, a CLI, and a serverless package
      for designing and running mock REST APIs. Mocks are configured in
      Mockoon and exposed locally as HTTP endpoints; the tool itself does not
      publish a remote control-plane REST API, so no OpenAPI definition is
      included in this repository.

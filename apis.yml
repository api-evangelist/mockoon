aid: mockoon
name: Mockoon
description: >-
  Mockoon is the easiest and quickest way to design and run mock REST APIs.
  Available as a free, open-source desktop application and CLI, it lets
  developers build, share, and serve realistic mock endpoints locally, in CI,
  or in containers. No remote deployment, no account required.
